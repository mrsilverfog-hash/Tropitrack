name: Build TropiTracker

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Compiler le mod
        run: gradle build
        env:
          GRADLE_OPTS: "-Xmx4g -Xms1g"

      - name: Publier le .jar dans Actions (sans zip)
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/tropitracker-1.0.0.jar
          archive: false
          if-no-files-found: error

      - name: Publier le .jar en téléchargement direct (Release "latest")
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "Jar publié : $JAR"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "Dernière version" --notes "Compilé automatiquement depuis le commit ${GITHUB_SHA::7}." --latest
